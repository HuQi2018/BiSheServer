
<script type="text/javascript">
    let user_watch_history = {{ data.user_watch_history|safe|default:"[]" }};
</script>
<div id="user_info_modify" class="mikd">
    <ul class="navLi nav-tabs">
        <li><a href="/userInfo.html">个人信息</a></li>
        <li><a href="/modifyPwd.html">密码修改</a></li>
        <li><a href="/modifyEmail.html">邮箱修改</a></li>
        <li><a href="/userCollection.html">收藏管理</a></li>
        <li><a href="/userComment.html">评论管理</a></li>
        <li class="active"><a href="/userHistory.html">观影历史</a></li>
    </ul>
    <div class="reg-box-pan display-inline">
        <div class="reg-box" style="margin-top:20px;">
            <div class="mi_btcon">
                <div class="bt_tit mi_ne_kd" style="margin-bottom: 20px;">
                    <h2 style="display: inline-block;">观影历史</h2>
                    <div style="display: inline-block; float: right; margin-right: 20px;">
                        <label>时间范围：</label>
                        <input type="date" id="startTime" placeholder="开始日期">
                        <span>至</span>
                        <input type="date" id="endTime" placeholder="结束日期">
                        <button class="btn btn-primary btn-sm" onclick="filterByTime()">筛选</button>
                        <button class="btn btn-default btn-sm" onclick="resetFilter()">重置</button>
                        <button class="btn btn-danger btn-sm" onclick="clearAllHistory()" style="margin-left: 20px;">清空全部历史</button>
                    </div>
                </div>
                <div class="bt_img mi_ne_kd leibox" id="user_watch_history">

                </div>
                <div id="no_history" style="text-align: center; padding: 50px; color: #999; display: none;">
                    <i class="fa fa-film" style="font-size: 48px; margin-bottom: 20px;"></i>
                    <p>暂无观影历史</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    function formatTime(timeStr) {
        if (!timeStr) return '';
        let date = new Date(timeStr);
        let year = date.getFullYear();
        let month = String(date.getMonth() + 1).padStart(2, '0');
        let day = String(date.getDate()).padStart(2, '0');
        let hour = String(date.getHours()).padStart(2, '0');
        let minute = String(date.getMinutes()).padStart(2, '0');
        return year + '-' + month + '-' + day + ' ' + hour + ':' + minute;
    }

    function formatDuration(seconds) {
        if (!seconds || seconds <= 0) return '0秒';
        if (seconds < 60) return seconds + '秒';
        if (seconds < 3600) return Math.floor(seconds / 60) + '分钟';
        let hours = Math.floor(seconds / 3600);
        let minutes = Math.floor((seconds % 3600) / 60);
        return hours + '小时' + minutes + '分钟';
    }

    function renderWatchHistory(historyList) {
        let container = $('#user_watch_history');
        let noHistory = $('#no_history');
        container.empty();

        if (!historyList || historyList.length === 0) {
            container.hide();
            noHistory.show();
            return;
        }

        container.show();
        noHistory.hide();

        for (let i = 0; i < historyList.length; i++) {
            let item = historyList[i];
            let movie = item.movie;
            if (!movie) continue;

            let images = {};
            try {
                images = typeof movie.images === 'string' ? JSON.parse(movie.images) : movie.images;
            } catch (e) {
                images = { small: '/static/images/default_movie.jpg' };
            }

            let isCompleted = item.is_completed;
            let progress = item.progress || 0;
            let watchTime = formatTime(item.watch_time);
            let duration = formatDuration(item.watch_duration);

            let html = '<div class="movie_item" style="position: relative; width: 180px; margin: 10px; display: inline-block;">' +
                '<div style="position: relative;">' +
                '<a href="/movie.html?id=' + movie.movie_id + '">' +
                '<img src="' + (images.small || '/static/images/default_movie.jpg') + '" alt="' + (movie.title || '') + '" style="width: 180px; height: 270px; object-fit: cover; border-radius: 5px;">' +
                '</a>' +
                '<div style="position: absolute; bottom: 0; left: 0; right: 0; height: 4px; background: rgba(0,0,0,0.3);">' +
                '<div style="height: 100%; background: ' + (isCompleted ? '#4CAF50' : '#FF9800') + '; width: ' + (isCompleted ? '100%' : progress + '%') + ';"></div>' +
                '</div>' +
                '<button class="btn btn-xs btn-danger" style="position: absolute; top: 5px; right: 5px; opacity: 0; transition: opacity 0.2s;" onclick="deleteHistory(' + movie.movie_id + ', this)" title="删除此记录">' +
                '<i class="fa fa-times"></i>' +
                '</button>' +
                '</div>' +
                '<div style="margin-top: 8px;">' +
                '<h4 style="margin: 0; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="' + (movie.title || '') + '">' +
                '<a href="/movie.html?id=' + movie.movie_id + '" style="color: #333;">' + (movie.title || '') + '</a>' +
                '</h4>' +
                '<p style="margin: 4px 0; font-size: 12px; color: #666;">' +
                '<span style="color: ' + (isCompleted ? '#4CAF50' : '#FF9800') + ';">' +
                (isCompleted ? '<i class="fa fa-check-circle"></i> 已看完' : '<i class="fa fa-play-circle"></i> 观看中 ' + progress + '%') +
                '</span>' +
                '</p>' +
                '<p style="margin: 2px 0; font-size: 11px; color: #999;">' +
                '<i class="fa fa-clock-o"></i> ' + watchTime +
                '</p>' +
                (item.watch_duration > 0 ? '<p style="margin: 2px 0; font-size: 11px; color: #999;"><i class="fa fa-hourglass-half"></i> 观看时长：' + duration + '</p>' : '') +
                '</div>' +
                '</div>';

            container.append(html);
        }

        $('.movie_item').hover(function() {
            $(this).find('.btn-danger').css('opacity', '1');
        }, function() {
            $(this).find('.btn-danger').css('opacity', '0');
        });
    }

    function deleteHistory(movieId, btn) {
        if (!confirm('确定要删除此观影记录吗？')) return;

        $.ajax({
            url: '/movie/watch_history_delete',
            type: 'GET',
            data: { movieId: movieId },
            dataType: 'json',
            success: function(data) {
                if (data.code === 200) {
                    show_tip(data.data.msg, '', 2);
                    $(btn).closest('.movie_item').remove();
                    
                    let remaining = $('#user_watch_history .movie_item').length;
                    if (remaining === 0) {
                        $('#user_watch_history').hide();
                        $('#no_history').show();
                    }
                } else {
                    show_tip(data.msg, '', 2);
                }
            },
            error: function() {
                show_tip('删除失败，请稍后重试', '', 2);
            }
        });
    }

    function clearAllHistory() {
        if (!confirm('确定要清空所有观影历史吗？此操作不可恢复！')) return;

        $.ajax({
            url: '/movie/watch_history_clear',
            type: 'GET',
            dataType: 'json',
            success: function(data) {
                if (data.code === 200) {
                    show_tip(data.data.msg, '', 2);
                    $('#user_watch_history').empty().hide();
                    $('#no_history').show();
                } else {
                    show_tip(data.msg, '', 2);
                }
            },
            error: function() {
                show_tip('清空失败，请稍后重试', '', 2);
            }
        });
    }

    function filterByTime() {
        let startTime = $('#startTime').val();
        let endTime = $('#endTime').val();

        if (!startTime && !endTime) {
            renderWatchHistory(user_watch_history);
            return;
        }

        if (startTime && endTime && startTime > endTime) {
            show_tip('开始日期不能晚于结束日期', '', 2);
            return;
        }

        $.ajax({
            url: '/movie/watch_history_list',
            type: 'GET',
            data: {
                startTime: startTime,
                endTime: endTime
            },
            dataType: 'json',
            success: function(data) {
                if (data.code === 200) {
                    renderWatchHistory(data.data.data);
                } else {
                    show_tip(data.msg, '', 2);
                }
            },
            error: function() {
                show_tip('筛选失败，请稍后重试', '', 2);
            }
        });
    }

    function resetFilter() {
        $('#startTime').val('');
        $('#endTime').val('');
        renderWatchHistory(user_watch_history);
    }

    renderWatchHistory(user_watch_history);
</script>
